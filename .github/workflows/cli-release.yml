name: CLI Release

on:
  push:
    tags:
      - "cli-v*"

jobs:
  build-cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            target_arch: x86_64
          - runner: macos-14
            target_os: macos
            target_arch: arm64
          - runner: macos-13
            target_os: macos
            target_arch: x86_64
          - runner: windows-latest
            target_os: windows
            target_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build ixos CLI
        run: cargo build --locked --release --bin ixos

      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package Unix artifact
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp target/release/ixos dist/pkg/ixos
          [ -f README.md ] && cp README.md dist/pkg/README.md || true
          [ -f LICENSE ] && cp LICENSE dist/pkg/LICENSE || true
          ARCHIVE="ixos-${VERSION}-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C dist/pkg .
          shasum -a 256 "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"

      - name: Smoke test packaged Unix artifact
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dist/ixos-${VERSION}-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz"
          mkdir -p dist/smoke
          tar -xzf "$ARCHIVE" -C dist/smoke
          test -x dist/smoke/ixos
          dist/smoke/ixos --version

      - name: Package Windows artifact
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "ixos-$env:VERSION-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip"
          $files = @("target/release/ixos.exe")
          if (Test-Path "README.md") { $files += "README.md" }
          if (Test-Path "LICENSE") { $files += "LICENSE" }
          Compress-Archive -Path $files -DestinationPath (Join-Path "dist" $archive) -Force
          $hash = (Get-FileHash -Path (Join-Path "dist" $archive) -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path (Join-Path "dist" "$archive.sha256") -Value "$hash  $archive"

      - name: Smoke test packaged Windows artifact
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path "dist" "ixos-$env:VERSION-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip"
          $smokeDir = Join-Path "dist" "smoke"
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath $smokeDir -Force
          & (Join-Path $smokeDir "ixos.exe") --version

      - name: Validate installer scripts syntax
        shell: bash
        run: |
          bash -n scripts/install.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/*

      - name: Upload assets to private GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*

  publish-to-releases:
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS

      - name: Upload to ixos-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          # Create or update release on ixos-releases
          gh release create "${{ github.ref_name }}" \
            --repo IxosProtocol/ixos-releases \
            --title "Ixos CLI ${{ github.ref_name }}" \
            --notes "CLI release ${{ github.ref_name }}" \
            artifacts/* \
            || gh release upload "${{ github.ref_name }}" \
              --repo IxosProtocol/ixos-releases \
              --clobber \
              artifacts/*
