name: Prepare CLI draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed CLI tag (cli-v...)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            binary: target/release/ixos
            extension: tar.gz
          - os: macos-15
            label: macos-arm64
            binary: target/release/ixos
            extension: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            binary: target/release/ixos
            extension: tar.gz
          - os: windows-latest
            label: windows-x86_64
            binary: target/release/ixos.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test core
        run: cargo test --locked -p ixos-protocol --lib --bin ixos --test settings_matrix --jobs 2
      - name: Build native CLI
        run: cargo build --locked --release --bin ixos --jobs 2
      - name: Prepare pinned actual models
        run: |
          python -m pip install numpy==2.3.5
          python scripts/setup_models.py --profile all --destination models/release-check
      - name: Actual model integration
        run: python scripts/verify_restored_cli.py --binary ${{ matrix.binary }} --code-model models/release-check/potion-code-16M-v2-unbounded --documents-model models/release-check/potion-retrieval-32M-row-int8 --output reports/release/profile.json
      - name: Package model setup and CLI
        run: python scripts/package_cli.py --binary ${{ matrix.binary }} --output dist/ixos-${{ matrix.label }}.${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: |
            dist/*
            reports/release/profile.json
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft on the monorepo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^cli-v[0-9][A-Za-z0-9._-]*$ ]]
          mapfile -d '' files < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          [[ ${#files[@]} -ge 8 ]]
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Ixos CLI $RELEASE_TAG" --notes "Free CPU retrieval CLI. Pinned model setup is included; see docs/CLI.md and the restoration evidence for conditions and limits." "${files[@]}"
