name: Engine and model contracts
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core tests
        run: cargo test --locked -p ixos-protocol --lib --bin ixos --test settings_matrix --jobs 2
      - name: Evaluation contracts
        run: |
          python -m pip install -r eval/requirements.txt
          python -m unittest discover -s eval -t .
      - name: Build release
        run: cargo build --locked --release --bin ixos --jobs 2
      - name: Install actual pinned artifacts
        run: python scripts/setup_models.py --profile all --destination models/ci
      - name: Native cache and profile integration
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'target/release/ixos.exe' } else { 'target/release/ixos' }
          python scripts/verify_retrieval_engine.py --binary $binary --model models/ci/potion-code-16M-v2-unbounded --output reports/ci/native-contract.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_restored_cli.py --binary $binary --code-model models/ci/potion-code-16M-v2-unbounded --documents-model models/ci/potion-retrieval-32M-row-int8 --output reports/ci/profile-contract.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_evidence_policy.py --binary $binary --model models/ci/potion-code-16M-v2-unbounded --output reports/ci/evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_anchor_stability.py --binary $binary --output reports/ci/stability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_query_literals.py --binary $binary --model models/ci/potion-code-16M-v2-unbounded --output reports/ci/query-literals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_cache_precision.py --binary $binary --code-model models/ci/potion-code-16M-v2-unbounded --documents-model models/ci/potion-retrieval-32M-row-int8 --root src --output reports/ci/cache-precision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_doctor.py --binary $binary --code-model models/ci/potion-code-16M-v2-unbounded --documents-model models/ci/potion-retrieval-32M-row-int8 --output reports/ci/doctor
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-contracts-${{ matrix.os }}
          path: reports/ci/
