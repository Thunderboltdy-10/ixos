name: perf-suite

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  perf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify models exist
        shell: pwsh
        run: |
          if (!(Test-Path "models/ixos-flash-v2")) { Write-Error "Ixos-Flash-v2 model missing. Provide models/ in CI." }

      - name: Run perf suite
        run: cargo run --bin ixos-perf-suite -- --config bench/perf_suite.toml

      - name: Check perf budgets
        run: python scripts/check_perf_budget.py --report bench/results/PERF_REGRESSION.json --budget bench/perf_budget.json

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: bench/results
