name: Release Postprocess

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Desktop release tag (e.g. v0.1.6)'
        required: true
        type: string
      publish_source_release:
        description: 'Publish private source release draft (if it exists)'
        required: false
        default: false
        type: boolean

jobs:
  generate-latest-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download release artifacts from ixos-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REPO="IxosProtocol/ixos-releases"

          for attempt in $(seq 1 12); do
            asset_count="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
            if [[ "$asset_count" -gt 0 ]]; then
              echo "Found release $TAG in $REPO with $asset_count assets"
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Release $TAG with assets was not found in $REPO after waiting." >&2
              gh release list --repo "$REPO" --limit 10 || true
              exit 1
            fi
            echo "Waiting for $REPO release assets (attempt $attempt/12)..."
            sleep 10
          done

          gh release download "$TAG" \
            --repo "$REPO" \
            --dir artifacts \
            --clobber

      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          ARTIFACTS_DIR: artifacts
          VERSION: ${{ inputs.release_tag }}
        run: node scripts/generate-latest-json.js

  publish-source-release:
    if: ${{ inputs.publish_source_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish source repo draft if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          SOURCE_REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --repo "$SOURCE_REPO"
          else
            echo "No private release $TAG found in $SOURCE_REPO; skipping."
          fi
