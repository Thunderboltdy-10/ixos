name: Release Postprocess

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Desktop release tag (e.g. v0.1.15)'
        required: true
        type: string
      publish_source_release:
        description: 'Publish private source release draft (if it exists)'
        required: false
        default: false
        type: boolean

jobs:
  copy-to-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts from source repo draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          SOURCE_REPO="${{ github.repository }}"

          if ! gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            echo "ERROR: No release/draft found for $TAG in $SOURCE_REPO" >&2
            echo "The main release workflow must have run and tauri-action must have uploaded at least some assets." >&2
            exit 1
          fi

          asset_count="$(gh release view "$TAG" --repo "$SOURCE_REPO" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [[ "$asset_count" -eq 0 ]]; then
            echo "ERROR: Release $TAG exists in $SOURCE_REPO but has no assets." >&2
            exit 1
          fi
          echo "Found $asset_count assets in $SOURCE_REPO $TAG — downloading..."

          gh release download "$TAG" \
            --repo "$SOURCE_REPO" \
            --dir artifacts \
            --clobber

          echo "Downloaded files:"
          ls -1 artifacts/

      - name: Prepare fixed-name copies (skips any missing platform)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts

          # Each loop runs only if a matching file exists (nullglob); silently skips otherwise.
          for f in ./*_x64-setup.exe;   do cp "$f" ixos-setup.exe    && echo "Windows installer -> ixos-setup.exe";    done
          for f in ./*_aarch64.dmg;     do cp "$f" ixos-aarch64.dmg  && echo "macOS aarch64 DMG -> ixos-aarch64.dmg";  done
          for f in ./*_x64.dmg;         do cp "$f" ixos-x64.dmg      && echo "macOS x64 DMG    -> ixos-x64.dmg";      done
          for f in ./*.AppImage;         do cp "$f" ixos.AppImage     && echo "Linux AppImage   -> ixos.AppImage";     done

          echo "Final artifact list:"
          ls -1

      - name: Upload to ixos-releases (skip already-uploaded files with --clobber)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REPO="IxosProtocol/ixos-releases"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Ixos $TAG" \
              --notes "Desktop release $TAG"
            echo "Created release $TAG in $REPO"
          else
            echo "Release $TAG already exists in $REPO — uploading/overwriting assets"
          fi

          # Collect fixed-name installer files that actually exist
          files=()
          for candidate in \
            artifacts/ixos-setup.exe \
            artifacts/ixos-aarch64.dmg \
            artifacts/ixos-x64.dmg \
            artifacts/ixos.AppImage; do
            [[ -f "$candidate" ]] && files+=("$candidate") && echo "Queued: $candidate"
          done

          # Collect updater bundles (.tar.gz, .zip) and their .sig files
          while IFS= read -r -d '' f; do
            files+=("$f")
            echo "Queued: $f"
          done < <(find artifacts -maxdepth 1 -type f \( \
            -name "*.app.tar.gz"      -o \
            -name "*.app.tar.gz.sig"  -o \
            -name "*.AppImage.tar.gz"     -o \
            -name "*.AppImage.tar.gz.sig" -o \
            -name "*.nsis.zip"        -o \
            -name "*.nsis.zip.sig"    -o \
            -name "*.msi.zip"         -o \
            -name "*.msi.zip.sig"     \
          \) -print0)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "ERROR: No uploadable desktop artifacts found." >&2
            exit 1
          fi

          gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            "${files[@]}" \
            scripts/install.sh \
            scripts/install.ps1

          echo "Upload complete (${#files[@]} artifact(s) + install scripts)"

  generate-latest-json:
    needs: copy-to-releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download release artifacts from ixos-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          REPO="IxosProtocol/ixos-releases"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG not found in $REPO" >&2
            exit 1
          fi

          gh release download "$TAG" \
            --repo "$REPO" \
            --dir artifacts \
            --clobber

          echo "Downloaded artifacts:"
          ls -1 artifacts/

      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          ARTIFACTS_DIR: artifacts
          VERSION: ${{ inputs.release_tag }}
        run: node scripts/generate-latest-json.js

  publish-source-release:
    if: ${{ inputs.publish_source_release }}
    needs: copy-to-releases
    runs-on: ubuntu-latest
    steps:
      - name: Publish source repo draft if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          SOURCE_REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --repo "$SOURCE_REPO"
            echo "Published draft release $TAG in $SOURCE_REPO"
          else
            echo "No release $TAG found in $SOURCE_REPO; skipping."
          fi
