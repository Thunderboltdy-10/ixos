name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  build:
    # Only the repository owner's tags release. Publishing depends on this job.
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: Windows-X64, python: '3.11'}
          - {os: ubuntu-24.04, platform: Linux-X64, python: '3.12'}
          - {os: macos-latest, platform: macOS-ARM64, python: '3.12'}
          - {os: macos-15-intel, platform: macOS-X64, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Linux desktop libraries and launch-test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev desktop-file-utils xvfb xauth xdotool
      - name: Build, test and save the installer
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/build-release.py --tag "$RELEASE_TAG" --platform "$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: ixos-${{ matrix.platform }}
          path: release-dist/${{ github.ref_name }}/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: ixos-*
          path: artifacts
      - name: Assemble verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/assemble-release.py artifacts release-assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Ixos $RELEASE_TAG" --generate-notes release-assets/*
