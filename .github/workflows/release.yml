name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to a draft release
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p ixos-cli
      - run: npm run tauri:build
      - name: Collect CLI and desktop installers
        shell: pwsh
        env:
          PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        run: |
          New-Item -ItemType Directory -Path release-dist | Out-Null
          $taskSuffix = if ($IsWindows) { '.exe' } else { '' }
          Copy-Item -LiteralPath "target/release/ixos$taskSuffix" -Destination "release-dist/ixos-$env:PLATFORM$taskSuffix"
          $taskInstallers = Get-ChildItem -LiteralPath target/release/bundle -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe', '.deb', '.rpm', '.AppImage', '.dmg') }
          if (-not $taskInstallers) { throw 'No desktop installers were built' }
          foreach ($taskInstaller in $taskInstallers) {
            Copy-Item -LiteralPath $taskInstaller.FullName -Destination (Join-Path release-dist $taskInstaller.Name)
          }
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ runner.os }}-${{ runner.arch }}
          path: release-dist/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
      - name: Attach binaries to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist' }
          $taskFiles = @(Get-ChildItem -LiteralPath artifacts -Recurse -File | ForEach-Object { $_.FullName })
          if ($taskFiles.Count -lt 6) { throw 'CLI and desktop artifacts are incomplete' }
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Ixos $env:RELEASE_TAG" --notes 'Local hybrid search over code and documents. Install a model after downloading; see the README.' @taskFiles
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
