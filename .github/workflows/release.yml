name: Release
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Component to build (independent release cadence)
        required: true
        type: choice
        options: [engine, desktop]
      tag:
        description: Existing engine-vX.Y.Z or desktop-vX.Y.Z tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: Windows-X64}
          - {os: ubuntu-latest, platform: Linux-X64}
          - {os: macos-latest, platform: macOS-ARM64}
          - {os: macos-15-intel, platform: macOS-X64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate component tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          if ($env:RELEASE_TAG -notmatch "^$($env:RELEASE_KIND)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$") { throw 'Tag must name the selected component and version' }
          $taskManifest = if ($env:RELEASE_KIND -eq 'engine') { 'crates/ixos-cli/Cargo.toml' } else { 'apps/desktop/src-tauri/Cargo.toml' }
          $taskVersion = (Select-String -LiteralPath $taskManifest -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "$($env:RELEASE_KIND)-v$taskVersion") { throw 'Tag must match the component package version' }
          if ($env:RELEASE_KIND -eq 'desktop' -and (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version -ne $taskVersion) { throw 'Tauri and desktop package versions must agree' }
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/setup-node@v7
        if: inputs.kind == 'desktop'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Linux desktop libraries
        if: inputs.kind == 'desktop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - if: inputs.kind == 'engine'
        run: cargo test --locked -p ixos-core -p ixos-cli -p ixos-runtime --all-features
      - if: inputs.kind == 'engine'
        run: cargo build --release --locked -p ixos-cli
      - name: Build the lightweight installer (included in both release kinds)
        run: cargo build --release --locked -p ixos-install
      - if: inputs.kind == 'desktop'
        run: npm ci
      - if: inputs.kind == 'desktop'
        run: npm run build
      - if: inputs.kind == 'desktop'
        name: Build signed desktop updates
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IXOS_UPDATER_PUBLIC_KEY: ${{ vars.IXOS_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:IXOS_UPDATER_PUBLIC_KEY) { throw 'Configure the desktop update signing key and public verification key before releasing' }
          npm run tauri:build
          if ($LASTEXITCODE -ne 0) { throw 'Signed desktop build failed' }
      - name: Verify Windows desktop installation and launch
        if: inputs.kind == 'desktop' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskInstallers = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -File -Filter '*-setup.exe')
          if ($taskInstallers.Count -ne 1) { throw 'Expected exactly one Windows desktop installer' }
          ./scripts/test-desktop-install.ps1 -Installer $taskInstallers[0].FullName
      - name: Collect component artifacts
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          New-Item -ItemType Directory -Path release-dist | Out-Null
          $taskSuffix = if ($IsWindows) { '.exe' } else { '' }
          $taskBootstrap = switch ($env:PLATFORM) { 'Windows-X64' { 'Windows-X64' }; 'Linux-X64' { 'Linux-x86_64' }; 'macOS-ARM64' { 'Darwin-arm64' }; 'macOS-X64' { 'Darwin-x86_64' } }
          Copy-Item -LiteralPath "target/release/ixos-install$taskSuffix" -Destination "release-dist/ixos-install-$taskBootstrap$taskSuffix"
          if ($env:RELEASE_KIND -eq 'engine') {
            $taskSuffix = if ($IsWindows) { '.exe' } else { '' }
            Copy-Item -LiteralPath "target/release/ixos$taskSuffix" -Destination "release-dist/ixos-$env:PLATFORM$taskSuffix"
          } else {
            $taskPattern = if ($IsWindows) { '*-setup.exe' } elseif ($IsMacOS) { '*.dmg' } else { '*.AppImage' }
            $taskInstallers = @(Get-ChildItem -LiteralPath target/release/bundle -Recurse -File -Filter $taskPattern)
            if ($taskInstallers.Count -ne 1) { throw 'Expected exactly one desktop installer for the platform' }
            $taskExtension = if ($IsWindows) { '-setup.exe' } elseif ($IsMacOS) { '.dmg' } else { '.AppImage' }
            Copy-Item -LiteralPath $taskInstallers[0].FullName -Destination "release-dist/Ixos-$env:PLATFORM$taskExtension"
            $taskUpdate = if ($IsMacOS) { @(Get-ChildItem -LiteralPath target/release/bundle -Recurse -File -Filter '*.app.tar.gz')[0] } else { $taskInstallers[0] }
            if (-not $taskUpdate -or -not (Test-Path -LiteralPath "$($taskUpdate.FullName).sig")) { throw 'Signed desktop update artifact missing' }
            $taskUpdateName = if ($IsMacOS) { "Ixos-$env:PLATFORM.app.tar.gz" } else { "Ixos-$env:PLATFORM$taskExtension" }
            if ($IsMacOS) {
              Copy-Item -LiteralPath $taskUpdate.FullName -Destination "release-dist/$taskUpdateName"
            }
            Copy-Item -LiteralPath "$($taskUpdate.FullName).sig" -Destination "release-dist/$taskUpdateName.sig"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}
          path: release-dist/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
      - name: Build runtime manifest
        if: inputs.kind == 'engine'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/runtime-manifest.py artifacts --version "${RELEASE_TAG#engine-v}" --output artifacts/runtime-manifest.json
      - name: Build desktop manifests
        if: inputs.kind == 'desktop'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/runtime-manifest.py artifacts --kind desktop --version "${RELEASE_TAG#desktop-v}" --output artifacts/desktop-manifest.json
      - name: Checksum the installers and attach bootstrap scripts
        shell: pwsh
        run: |
          Copy-Item scripts/install-cli.ps1,scripts/install-cli.sh -Destination artifacts
          $taskLines = Get-ChildItem -LiteralPath artifacts -Recurse -File | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText((Join-Path $PWD artifacts/SHA256SUMS), (($taskLines -join "`n") + "`n"))
      - name: Attach artifacts to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist' }
          $taskFiles = @(Get-ChildItem -LiteralPath artifacts -Recurse -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Ixos $env:RELEASE_TAG" --notes 'See README and docs/INSTALLATION.md for runtime, models, skill and MCP setup.' @taskFiles
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
