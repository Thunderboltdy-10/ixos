name: Release
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Component to build (independent release cadence)
        required: true
        type: choice
        options: [engine, desktop]
      tag:
        description: Existing engine-vX.Y.Z or desktop-vX.Y.Z tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: Windows-X64}
          - {os: ubuntu-latest, platform: Linux-X64}
          - {os: macos-latest, platform: macOS-ARM64}
          - {os: macos-15-intel, platform: macOS-X64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate component tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          if ($env:RELEASE_TAG -notmatch "^$($env:RELEASE_KIND)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$") { throw 'Tag must name the selected component and version' }
          $taskManifest = if ($env:RELEASE_KIND -eq 'engine') { 'crates/ixos-cli/Cargo.toml' } else { 'apps/desktop/src-tauri/Cargo.toml' }
          $taskVersion = (Select-String -LiteralPath $taskManifest -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "$($env:RELEASE_KIND)-v$taskVersion") { throw 'Tag must match the component package version' }
          if ($env:RELEASE_KIND -eq 'desktop' -and (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version -ne $taskVersion) { throw 'Tauri and desktop package versions must agree' }
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/setup-node@v7
        if: inputs.kind == 'desktop'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Linux desktop libraries
        if: inputs.kind == 'desktop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - if: inputs.kind == 'engine'
        run: cargo test --locked -p ixos-core -p ixos-cli -p ixos-runtime --all-features
      - if: inputs.kind == 'engine'
        run: cargo build --release --locked -p ixos-cli
      - if: inputs.kind == 'desktop'
        run: npm ci
      - if: inputs.kind == 'desktop'
        run: npm run build
      - if: inputs.kind == 'desktop'
        run: npm run tauri:build
      - name: Collect component artifacts
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          New-Item -ItemType Directory -Path release-dist | Out-Null
          if ($env:RELEASE_KIND -eq 'engine') {
            $taskSuffix = if ($IsWindows) { '.exe' } else { '' }
            Copy-Item -LiteralPath "target/release/ixos$taskSuffix" -Destination "release-dist/ixos-$env:PLATFORM$taskSuffix"
          } else {
            $taskInstallers = Get-ChildItem -LiteralPath target/release/bundle -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe', '.deb', '.rpm', '.AppImage', '.dmg') }
            if (-not $taskInstallers) { throw 'No desktop installers were built' }
            foreach ($taskInstaller in $taskInstallers) {
              Copy-Item -LiteralPath $taskInstaller.FullName -Destination (Join-Path release-dist $taskInstaller.Name)
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}
          path: release-dist/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
      - name: Build runtime manifest
        if: inputs.kind == 'engine'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/runtime-manifest.py artifacts --version "${RELEASE_TAG#engine-v}" --output artifacts/runtime-manifest.json
      - name: Attach artifacts to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist' }
          $taskFiles = @(Get-ChildItem -LiteralPath artifacts -Recurse -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Ixos $env:RELEASE_TAG" --notes 'See README and docs/INSTALLATION.md for runtime, models, skill and MCP setup.' @taskFiles
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
