name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are meant for build on CI correctly
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install root dependencies
        run: npm ci --prefer-offline --no-audit

      - name: install UI dependencies with platform-specific native modules
        working-directory: ui
        run: |
          npm ci --prefer-offline --no-audit --include=optional

      - name: build UI
        working-directory: ui
        run: npm run build

      - name: verify built assets
        run: |
          if [ ! -d "ui/dist" ]; then
            echo "ERROR: UI build failed - dist directory not found"
            exit 1
          fi
          echo "✓ UI build successful: ui/dist exists"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  upload-to-blob:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        
      - name: Download all release artifacts
        # We need a way to get the artifacts. Since tauri-action uploads to GitHub Release,
        # we can download them from there or simply re-upload from the build step if we used artifacts.
        # However, tauri-action handles the release upload. 
        # A simpler way is to grab the release assets using gh cli.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download app-${{ github.ref_name }} --dir artifacts
          
      - name: Upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ARTIFACTS_DIR: artifacts
        run: node scripts/upload-release.js
