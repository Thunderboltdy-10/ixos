name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate install.sh syntax
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: bash -n scripts/install.sh

      - name: Validate install.ps1 syntax
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Create model stubs for Windows build
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p models/ixos-flash-v2
          mkdir -p models/potion-base-8M-int8
          touch models/ixos-flash-v2/.gitkeep
          touch models/potion-base-8M-int8/.gitkeep

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Verify built assets
        shell: bash
        run: |
          test -d ui/dist
          echo "UI build successful: ui/dist exists"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          IXOS_JWT_PUBLIC_KEY: ${{ secrets.IXOS_JWT_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ixos ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  copy-to-releases:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts from private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} --dir artifacts

      - name: Prepare fixed-name artifacts
        shell: bash
        run: |
          cd artifacts
          # Create fixed-name copies for stable "latest" URLs
          find . -name "*_x64-setup.exe" -exec cp {} ixos-setup.exe \;
          find . -name "*_aarch64.dmg" -exec cp {} ixos-aarch64.dmg \;
          find . -name "*_x64.dmg" -exec cp {} ixos-x64.dmg \;
          find . -name "*.AppImage" -exec cp {} ixos.AppImage \;
          cd ..

      - name: Upload desktop installers to ixos-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo IxosProtocol/ixos-releases \
            --title "Ixos ${{ github.ref_name }}" \
            --notes "Desktop release ${{ github.ref_name }}" \
            artifacts/* \
            || gh release upload "${{ github.ref_name }}" \
              --repo IxosProtocol/ixos-releases \
              --clobber \
              artifacts/*

  generate-latest-json:
    needs: copy-to-releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} --dir artifacts

      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          ARTIFACTS_DIR: artifacts
          VERSION: ${{ github.ref_name }}
        run: node scripts/generate-latest-json.js

  publish-draft:
    needs: copy-to-releases
    runs-on: ubuntu-latest
    steps:
      - name: Publish private draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
