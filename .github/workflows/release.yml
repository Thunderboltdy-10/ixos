name: Release
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Component to build
        required: true
        type: choice
        options: [engine, desktop]
      tag:
        description: Existing engine-vX.Y.Z or desktop-vX.Y.Z tag
        required: true
        type: string
      signed_updates:
        description: Sign automatic desktop updates (requires repository signing keys)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: Windows-X64, python: '3.11'}
          - {os: ubuntu-24.04, platform: Linux-X64, python: '3.12'}
          - {os: macos-latest, platform: macOS-ARM64, python: '3.12'}
          - {os: macos-15-intel, platform: macOS-X64, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        if: inputs.kind == 'desktop'
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Linux desktop libraries and launch-test tools
        if: inputs.kind == 'desktop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf desktop-file-utils xvfb xauth xdotool libfuse2
      - name: Build, test and save release artifacts
        shell: pwsh
        env:
          RELEASE_KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          SIGNED_UPDATES: ${{ inputs.kind == 'desktop' && inputs.signed_updates }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IXOS_UPDATER_PUBLIC_KEY: ${{ vars.IXOS_UPDATER_PUBLIC_KEY }}
        run: |
          $taskArgs = @('scripts/build-release.py', '--kind', $env:RELEASE_KIND, '--tag', $env:RELEASE_TAG, '--platform', $env:RELEASE_PLATFORM)
          if ($env:SIGNED_UPDATES -eq 'true') { $taskArgs += '--signed-updates' }
          python @taskArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.kind }}-${{ matrix.platform }}
          path: release-dist/${{ inputs.tag }}/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.kind }}-*
          path: artifacts
      - name: Assemble verified release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_KIND: ${{ inputs.kind }}
          SIGNED_UPDATES: ${{ inputs.kind == 'desktop' && inputs.signed_updates }}
        run: python scripts/assemble-release.py artifacts release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tag }}-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Attach artifacts to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist' }
          $taskFiles = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Ixos $env:RELEASE_TAG" --notes 'Download the installer for your system, open it, and launch Ixos from your applications. Agent setup commands are in the README.' @taskFiles
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
