[package]
name = "ixos-app"
version = "0.1.0"
description = "Local hybrid search desktop"
authors = ["Ixos Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Thunderboltdy-10/ixos"

[lib]
name = "ixos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
ixos-runtime = { path = "../../../crates/ixos-runtime", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
dunce = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

