[package]
name = "ixos-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Local hybrid search for code and documents"

[[bin]]
name = "ixos"
path = "src/main.rs"

[dependencies]
ixos-core = { path = "../ixos-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
[dev-dependencies]
tempfile = "3.15"
