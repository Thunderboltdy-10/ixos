[package]
name = "ixos-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Local hybrid search over code and documents"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
half = { version = "2.4", features = ["bytemuck"] }
bytemuck = "=1.25.0"
safetensors = "=0.5.3"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
ignore = "0.4"
rayon = "1.10"
regex = "1.10"
grep-regex = "0.1"
grep-searcher = "0.1"
heed = "0.20"
tracing = "0.1"
pdf-extract = "0.7"
lopdf = "0.32"
calamine = "0.24"
zip = "0.6"
quick-xml = "0.31"
ureq = "2"
tempfile = "3.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
[target.'cfg(unix)'.dependencies]
xattr = "1.3"

[dev-dependencies]
model2vec-rs = "0.1.4"
tempfile = "3.15"
