[package]
name = "ixos-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Ixos runtime contracts and lightweight desktop client"

[features]
default = []
client = ["dep:ureq", "dep:sha2", "dep:tempfile", "dep:windows-sys"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5"
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
