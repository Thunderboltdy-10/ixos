<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#brandGradient)"/>

  <!-- Inner dark circle -->
  <circle cx="256" cy="256" r="200" fill="#0a0a0f"/>

  <!-- X mark representing Ixos - stylized as crossing search beams -->
  <!-- First stroke of X (top-left to bottom-right) with speed lines -->
  <path d="M 140 140 L 372 372" stroke="#0d9488" stroke-width="48" stroke-linecap="round"/>

  <!-- Second stroke of X (top-right to bottom-left) -->
  <path d="M 372 140 L 140 372" stroke="#0d9488" stroke-width="48" stroke-linecap="round"/>

  <!-- Center dot representing focus/privacy -->
  <circle cx="256" cy="256" r="32" fill="#0a0a0f"/>
  <circle cx="256" cy="256" r="20" fill="#0d9488"/>

  <!-- Small accent dots representing speed -->
  <circle cx="100" cy="256" r="8" fill="#0d9488" opacity="0.6"/>
  <circle cx="412" cy="256" r="8" fill="#0d9488" opacity="0.6"/>
</svg>
