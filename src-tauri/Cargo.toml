[package]
name = "ixos-app"
version = "0.1.0"
description = "Ixos - Privacy-first semantic file search"
authors = ["Ixos Team"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ixos/ixos-protocol"

[lib]
name = "ixos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

# The core Ixos protocol library
ixos-protocol = { path = ".." }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }

# Async runtime (shared with ixos-protocol)
tokio = { version = "1.43", features = ["full", "sync"] }
tokio-util = "0.7"

# Synchronization
parking_lot = "0.12"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Directory utilities
dirs = "5.0"
tauri-plugin-fs = "2.4.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
